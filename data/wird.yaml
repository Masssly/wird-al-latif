# al-Wird al-Laṭīf of Imām ʿAbd Allāh ibn ʿAlawī al-Ḥaddād — structure and Arabic.
#
# Single source of truth for the order of the wird, repeat counts, the duʿā
# Arabic and which Qurʾānic verses are read.  Language-specific text lives in
# data/translit.yaml (transliteration) and i18n/<lang>.yaml (meanings).
# The schema is described in docs/DATA.md.
#
# The duʿā Arabic is UNPROOFREAD (see REVIEW.md).  Do not correct it from
# memory; open an issue or add a note to REVIEW.md instead.

edition: "1.0"
title: "الْوِرْدُ اللَّطِيفُ"

sections:

  - id: quran
    items:

      - id: ikhlas
        repeat: 3
        quran:
          verses: "112:1-4"
          basmala: true

      - id: falaq
        repeat: 3
        quran:
          verses: "113:1-5"
          basmala: true

      - id: nas
        repeat: 3
        quran:
          verses: "114:1-6"
          basmala: true

      - id: muminun-97
        repeat: 3
        quran:
          verses: "23:97-98"
          # The wird starts at رَبِّ, so the KFGQPC wording is adjusted at build time (REVIEW.md R-Q1).
          opening: {replace: "وَقُل رَّبِّ", with: "رَبِّ"}

      - id: muminun-115
        quran:
          verses: "23:115-118"

      - id: rum-17
        quran:
          verses: "30:17-19"

      - id: taawwudh
        repeat: 3
        arabic: "أَعُوذُ بِاللَّهِ السَّمِيعِ الْعَلِيمِ مِنَ الشَّيْطَانِ الرَّجِيمِ"

      - id: hashr-21
        quran:
          verses: "59:21-24"

      - id: saffat-79
        quran:
          verses: "37:79-81"

  - id: protection
    items:

      - id: kalimat-tammat
        repeat: 3
        arabic: "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ"

      - id: bismillah-la-yadurr
        repeat: 3
        arabic: "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ"

  - id: witness
    items:

      - id: nima-afiya-sitr
        repeat: 3
        arabic:
          - "اللَّهُمَّ إِنِّي "
          - {morning: "أَصْبَحْتُ", evening: "أَمْسَيْتُ"}
          - " مِنْكَ فِي نِعْمَةٍ وَعَافِيَةٍ وَسِتْرٍ، فَأَتْمِمْ نِعْمَتَكَ عَلَيَّ وَعَافِيَتَكَ وَسِتْرَكَ فِي الدُّنْيَا وَالْآخِرَةِ"

      - id: ushhiduka
        repeat: 4
        arabic:
          - "اللَّهُمَّ إِنِّي "
          - {morning: "أَصْبَحْتُ", evening: "أَمْسَيْتُ"}
          - " أُشْهِدُكَ، وَأُشْهِدُ حَمَلَةَ عَرْشِكَ وَمَلَائِكَتَكَ وَجَمِيعَ خَلْقِكَ، أَنَّكَ أَنْتَ اللَّهُ لَا إِلَٰهَ إِلَّا أَنْتَ وَحْدَكَ لَا شَرِيكَ لَكَ، وَأَنَّ سَيِّدَنَا مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ"

      - id: hamdan-yuwafi
        repeat: 3
        arabic: "الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ، حَمْدًا يُوَافِي نِعَمَهُ وَيُكَافِئُ مَزِيدَهُ"

      - id: amantu
        repeat: 3
        arabic: "آمَنْتُ بِاللَّهِ الْعَظِيمِ، وَكَفَرْتُ بِالْجِبْتِ وَالطَّاغُوتِ، وَاسْتَمْسَكْتُ بِالْعُرْوَةِ الْوُثْقَىٰ لَا انْفِصَامَ لَهَا وَاللَّهُ سَمِيعٌ عَلِيمٌ"

      - id: raditu
        repeat: 3
        arabic: "رَضِيتُ بِاللَّهِ رَبًّا، وَبِالْإِسْلَامِ دِينًا، وَبِسَيِّدِنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَآلِهِ وَسَلَّمَ نَبِيًّا وَرَسُولًا"

      - id: hasbiya
        repeat: 7
        quran:
          verses: "9:129"
          from_word: "حَسۡبِيَ"
          quote: true   # read like a duʿā: own transliteration and meaning, no verse translations

      - id: salat-wa-sahbihi
        repeat: 10
        arabic: "اللَّهُمَّ صَلِّ عَلَىٰ سَيِّدِنَا مُحَمَّدٍ وَآلِهِ وَصَحْبِهِ وَسَلِّمْ"

  - id: asking
    items:

      - id: fujaat
        arabic: "اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فُجَاءَةِ الْخَيْرِ، وَأَعُوذُ بِكَ مِنْ فُجَاءَةِ الشَّرِّ"

      - id: sayyid-al-istighfar
        arabic: "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَٰهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَىٰ عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ وَأَبُوءُ بِذَنْبِي، فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ"

      - id: alayka-tawakkaltu
        arabic: "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَٰهَ إِلَّا أَنْتَ، عَلَيْكَ تَوَكَّلْتُ وَأَنْتَ رَبُّ الْعَرْشِ الْعَظِيمِ"

      - id: ma-shaa-allah
        arabic: "مَا شَاءَ اللَّهُ كَانَ، وَمَا لَمْ يَشَأْ لَمْ يَكُنْ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ"

      - id: alamu
        arabic: "أَعْلَمُ أَنَّ اللَّهَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ، وَأَنَّ اللَّهَ قَدْ أَحَاطَ بِكُلِّ شَيْءٍ عِلْمًا"

      - id: sharri-nafsi
        arabic: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنْ شَرِّ نَفْسِي، وَمِنْ شَرِّ كُلِّ دَابَّةٍ أَنْتَ آخِذٌ بِنَاصِيَتِهَا، إِنَّ رَبِّي عَلَىٰ صِرَاطٍ مُسْتَقِيمٍ"

      - id: ya-hayyu
        arabic: "يَا حَيُّ يَا قَيُّومُ، بِرَحْمَتِكَ أَسْتَغِيثُ، وَمِنْ عَذَابِكَ أَسْتَجِيرُ، أَصْلِحْ لِي شَأْنِي كُلَّهُ، وَلَا تَكِلْنِي إِلَىٰ نَفْسِي وَلَا إِلَىٰ أَحَدٍ مِنْ خَلْقِكَ طَرْفَةَ عَيْنٍ"

      - id: hamm-hazan
        arabic: "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَأَعُوذُ بِكَ مِنَ الْعَجْزِ وَالْكَسَلِ، وَأَعُوذُ بِكَ مِنَ الْجُبْنِ وَالْبُخْلِ، وَأَعُوذُ بِكَ مِنْ غَلَبَةِ الدَّيْنِ وَقَهْرِ الرِّجَالِ"

      - id: afiya
        arabic: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَافِيَةَ فِي الدُّنْيَا وَالْآخِرَةِ"

      - id: afw-afiya
        arabic: "اللَّهُمَّ إِنِّي أَسْأَلُكَ الْعَفْوَ وَالْعَافِيَةَ وَالْمُعَافَاةَ الدَّائِمَةَ فِي دِينِي وَدُنْيَايَ وَأَهْلِي وَمَالِي"

      - id: ustur
        arabic: "اللَّهُمَّ اسْتُرْ عَوْرَاتِي وَآمِنْ رَوْعَاتِي"

      - id: ihfazni
        arabic: "اللَّهُمَّ احْفَظْنِي مِنْ بَيْنِ يَدَيَّ وَمِنْ خَلْفِي، وَعَنْ يَمِينِي وَعَنْ شِمَالِي وَمِنْ فَوْقِي، وَأَعُوذُ بِعَظَمَتِكَ أَنْ أُغْتَالَ مِنْ تَحْتِي"

      - id: khalaqtani
        arabic: "اللَّهُمَّ أَنْتَ خَلَقْتَنِي وَأَنْتَ تَهْدِينِي وَأَنْتَ تُطْعِمُنِي وَأَنْتَ تَسْقِينِي وَأَنْتَ تُمِيتُنِي وَأَنْتَ تُحْيِينِي، وَأَنْتَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ"

  - id: morning-evening
    items:

      - id: fitrat-al-islam
        arabic:
          - {morning: "أَصْبَحْنَا", evening: "أَمْسَيْنَا"}
          - " عَلَىٰ فِطْرَةِ الْإِسْلَامِ، وَعَلَىٰ كَلِمَةِ الْإِخْلَاصِ، وَعَلَىٰ دِينِ نَبِيِّنَا مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَآلِهِ وَسَلَّمَ، وَعَلَىٰ مِلَّةِ أَبِينَا إِبْرَاهِيمَ حَنِيفًا مُسْلِمًا وَمَا كَانَ مِنَ الْمُشْرِكِينَ"

      - id: bika-asbahna
        arabic:
          - "اللَّهُمَّ بِكَ "
          - {morning: "أَصْبَحْنَا", evening: "أَمْسَيْنَا"}
          - " وَبِكَ "
          - {morning: "أَمْسَيْنَا", evening: "أَصْبَحْنَا"}
          - " وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَعَلَيْكَ نَتَوَكَّلُ وَإِلَيْكَ "
          - {morning: "النُّشُورُ", evening: "الْمَصِيرُ"}

      - id: al-mulku-lillah
        arabic:
          - {morning: "أَصْبَحْنَا", evening: "أَمْسَيْنَا"}
          - " "
          - {morning: "وَأَصْبَحَ", evening: "وَأَمْسَى"}
          - " الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ"

      - id: khayra-hadha-al-yawm
        arabic:
          - "اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ "
          - {morning: "هَٰذَا الْيَوْمِ", evening: "هَٰذِهِ اللَّيْلَةِ"}
          - "، "
          - {morning: "فَتْحَهُ", evening: "فَتْحَهَا"}
          - " "
          - {morning: "وَنَصْرَهُ", evening: "وَنَصْرَهَا"}
          - " "
          - {morning: "وَنُورَهُ", evening: "وَنُورَهَا"}
          - " "
          - {morning: "وَبَرَكَتَهُ", evening: "وَبَرَكَتَهَا"}
          - " "
          - {morning: "وَهُدَاهُ", evening: "وَهُدَاهَا"}

      - id: khayra-ma-fih
        arabic:
          - "اللَّهُمَّ إِنِّي أَسْأَلُكَ خَيْرَ "
          - {morning: "هَٰذَا الْيَوْمِ", evening: "هَٰذِهِ اللَّيْلَةِ"}
          - " وَخَيْرَ مَا "
          - {morning: "فِيهِ", evening: "فِيهَا"}
          - "، وَخَيْرَ مَا "
          - {morning: "قَبْلَهُ", evening: "قَبْلَهَا"}
          - " وَخَيْرَ مَا "
          - {morning: "بَعْدَهُ", evening: "بَعْدَهَا"}
          - "، وَأَعُوذُ بِكَ مِنْ شَرِّ "
          - {morning: "هَٰذَا الْيَوْمِ", evening: "هَٰذِهِ اللَّيْلَةِ"}
          - " وَشَرِّ مَا "
          - {morning: "فِيهِ", evening: "فِيهَا"}
          - "، وَشَرِّ مَا "
          - {morning: "قَبْلَهُ", evening: "قَبْلَهَا"}
          - " وَشَرِّ مَا "
          - {morning: "بَعْدَهُ", evening: "بَعْدَهَا"}

      - id: ma-asbaha-bi
        arabic:
          - "اللَّهُمَّ مَا "
          - {morning: "أَصْبَحَ", evening: "أَمْسَى"}
          - " بِي مِنْ نِعْمَةٍ أَوْ بِأَحَدٍ مِنْ خَلْقِكَ، فَمِنْكَ وَحْدَكَ لَا شَرِيكَ لَكَ، فَلَكَ الْحَمْدُ وَلَكَ الشُّكْرُ عَلَىٰ ذَٰلِكَ"

  - id: glorification
    items:

      - id: subhan-allah-wa-bihamdih
        repeat: 3
        arabic: "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ وَرِضَاءَ نَفْسِهِ وَزِنَةَ عَرْشِهِ وَمِدَادَ كَلِمَاتِهِ"

      - id: subhan-allah-al-azim
        repeat: 3
        arabic: "سُبْحَانَ اللَّهِ الْعَظِيمِ وَبِحَمْدِهِ عَدَدَ خَلْقِهِ وَرِضَاءَ نَفْسِهِ وَزِنَةَ عَرْشِهِ وَمِدَادَ كَلِمَاتِهِ"

      - id: adad-tasbih
        arabic: "سُبْحَانَ اللَّهِ عَدَدَ مَا خَلَقَ فِي السَّمَاءِ، سُبْحَانَ اللَّهِ عَدَدَ مَا خَلَقَ فِي الْأَرْضِ، سُبْحَانَ اللَّهِ عَدَدَ مَا بَيْنَ ذَٰلِكَ، سُبْحَانَ اللَّهِ عَدَدَ مَا هُوَ خَالِقٌ"

      - id: adad-tahmid
        arabic: "الْحَمْدُ لِلَّهِ عَدَدَ مَا خَلَقَ فِي السَّمَاءِ، الْحَمْدُ لِلَّهِ عَدَدَ مَا خَلَقَ فِي الْأَرْضِ، الْحَمْدُ لِلَّهِ عَدَدَ مَا بَيْنَ ذَٰلِكَ، الْحَمْدُ لِلَّهِ عَدَدَ مَا هُوَ خَالِقٌ"

      - id: adad-tahlil
        arabic: "لَا إِلَٰهَ إِلَّا اللَّهُ عَدَدَ مَا خَلَقَ فِي السَّمَاءِ، لَا إِلَٰهَ إِلَّا اللَّهُ عَدَدَ مَا خَلَقَ فِي الْأَرْضِ، لَا إِلَٰهَ إِلَّا اللَّهُ عَدَدَ مَا بَيْنَ ذَٰلِكَ، لَا إِلَٰهَ إِلَّا اللَّهُ عَدَدَ مَا هُوَ خَالِقٌ"

      - id: adad-takbir
        arabic: "اللَّهُ أَكْبَرُ عَدَدَ مَا خَلَقَ فِي السَّمَاءِ، اللَّهُ أَكْبَرُ عَدَدَ مَا خَلَقَ فِي الْأَرْضِ، اللَّهُ أَكْبَرُ عَدَدَ مَا بَيْنَ ذَٰلِكَ، اللَّهُ أَكْبَرُ عَدَدَ مَا هُوَ خَالِقٌ"

      - id: adad-hawqala
        arabic: "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ عَدَدَ مَا خَلَقَ فِي السَّمَاءِ، لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ عَدَدَ مَا خَلَقَ فِي الْأَرْضِ، لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ عَدَدَ مَا بَيْنَ ذَٰلِكَ، لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ الْعَلِيِّ الْعَظِيمِ عَدَدَ مَا هُوَ خَالِقٌ"

      - id: tahlil-dharrah
        repeat: 3
        arabic: "لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ، يُحْيِي وَيُمِيتُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ، عَدَدَ كُلِّ ذَرَّةٍ أَلْفَ مَرَّةٍ"

      - id: salat-miftah
        repeat: 3
        arabic: "اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَىٰ سَيِّدِنَا مُحَمَّدٍ مِفْتَاحِ بَابِ رَحْمَةِ اللَّهِ، عَدَدَ مَا فِي عِلْمِ اللَّهِ، صَلَاةً وَسَلَامًا دَائِمَيْنِ بِدَوَامِ مُلْكِ اللَّهِ، وَعَلَىٰ آلِهِ وَصَحْبِهِ عَدَدَ كُلِّ ذَرَّةٍ أَلْفَ مَرَّةٍ"
