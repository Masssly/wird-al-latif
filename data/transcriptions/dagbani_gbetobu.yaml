basmala: "(Ti piliya) Ni Naawuni yuli, Dunia Nambɔzobonaa, Zaadali Nambɔzobonaa"

verses:
  "112:1": "(Yaa nyini Annabi)! Yɛlima: “Ŋuna Naawuni nyɛla zaɣigaŋ.”"
  "112:2": "Naawuni nyɛla bɛ ni mali bukaata n-kpari So."
  "112:3": "O bi dɔɣi, bɛ mi bi dɔɣi o."
  "112:4": "O mi ka binshɛɣu din ŋmani O."
  "113:1": "(Yaa nyini Annabi)! Yɛlima: “M-bɔri taɣibu ni asibaasi Duuma."
  "113:2": "Ka chɛ O ni nam shɛli zaɣibetali."
  "113:3": "Ni yuŋ zaɣibetali, di yi ti zibi."
  "113:4": "Ni paɣa shɛba ban tuhiri niŋdi kabiriti ni zaɣibetali."
  "113:5": "Ni putɔɣulana, o yi ti niŋ putɔɣu."
  "114:1": "(Yaa nyini Annabi)! Yɛlima: “M-bɔri taɣibu ni ninsalinim’ Duuma."
  "114:2": "Ninsalinim’ sulinsilana."
  "114:3": "Ninsalinim’ Duuma jɛmdigu."
  "114:4": "Ka chɛ yɛltɔɣabɛri lana (shintaŋ) zaɣibetali, ŋun sɔɣira."
  "114:5": "Ŋuna n-nyɛ ŋun zaŋdi yɛltɔɣabɛri m-bahiri ninsalinim’ suhiri ni."
  "114:6": "Alizinnim’ mini ninsalinim’ puuni."
  "23:97": "Yaha! Yɛlima: “Yaa n Duuma Naawuni! M-bɔri taɣibu a sani ni shintana ti zaŋ din be niŋ n suhi ni.”"
  "23:98": "“Yaha! M-bɔri taɣibu A sani ni bɛ (shintana) ti miri ma.”"
  "23:115": "“Di ni bɔŋɔ, yi (ninsalinim’) tɛhimi ni achiika! Ti (Tinim’ Naawuni) nam ya mi ka di nyɛla kpɛrigu zuɣu, ka (tɛhi) ni bɛ ku lahi labsi ya na Ti sani?”"
  "23:116": "Dinzuɣu, Naawuni nam duya, Ŋuna n-nyɛ yɛlimaŋli Naa, duuma jɛmdigu n-kani ni yɛlimaŋli naɣila Ŋuna, Al-arshi shɛli din galsila Duuma."
  "23:117": "Yaha! Ŋun ti jɛm shɛli m-pahi Naawuni zuɣu, tɔ! O ka daliri shɛli, dinzuɣu o saliya karibu be O Duuma (Naawuni) sani. Achiika! Chɛfurinim’ ti ku tilgi (Zaadali)."
  "23:118": "(Yaa nyini Annabi)! Yɛlima: “Yaa n Duuma (Naawuni)! Chɛli paŋ, ka zo nambɔɣu. Yaha! Nyini n-nyɛ Ŋun zɔri nambɔɣu n-gari ŋun kam zɔri nambɔɣu.”"
  "30:17": "Dinzuɣu, Naawuni nam niŋ kasi saha shɛli wuntaŋ’ ni luri ya, ni saha shɛli yi ni neeri bɛɣu."
  "30:18": "Yaha! Paɣibu balibu kam nyɛla O dini sagbana mini tiŋgbani ni, ni Zaawuni, n-ti pahi Azafar jiŋli saha."
  "30:19": "O (Naawuni) yihirila nyɛvulilana bimkpiŋ ni, ka yihiri bimkpiŋ nyɛvulilana puuni, ka neeri tiŋgbani di kpibu nyaaŋa. Yaha! Lala ka bɛ yɛn ti yihi ya (yi gbala ni na)."
  "59:21": "Ti (Tinim Naawuni) yi di siɣisi la Alkur’aani ŋɔ maa zoli zuɣu na, a naan nya li ka di nyɛla din balgi di maŋa, ka nyɛla din tahibɔɣi domin Naawuni zobo zuɣu. Yaha! Ti tiri la ninsalinim kotomsi ŋɔ maa, domin achiika! Bɛ nyɛla ban yɛn niŋ tɛha."
  "59:22": "Ŋuna n-nyɛ Naawuni so duuma jɛmdigu n-kani ni yɛlimaŋli naɣila Ŋuna, Ŋuna n-nyɛ Ŋun mi din sɔɣi, ni din be polo ni, Ŋuna n-nyɛ Dunia Nambɔnaa, Zaadali Nambɔnaa."
  "59:23": "Ŋuna n-nyɛ Naawuni so duuma jɛmdigu ni kani ni yɛlimaŋli naɣila Ŋuna, Sulinsilana, Ŋun niŋ kasi, Yɛmbahiga lana, Ŋun tiri yɛmbahiga, Ŋun gula, Ŋun nyɛŋdi yɛllikam, Ŋun zaandi talahi, Tibginsim lana, O nam niŋ kasi ka chɛ bɛ ni laɣindi O mini shɛli jɛmdi maa."
  "59:24": "Ŋuna n-nyɛ Naawuni so Ŋun namda, Ŋun piindi nambu, Ŋun tiri ŋmahiŋgbana, O malila yulisuma, binshɛɣu din be sagbana ni, ni din be tiŋgbani ni niŋdi O la kasi. Yaha! Ŋuna n-nyɛ Nyɛŋda, Yɛmgoliŋga lana."
  "37:79": "Suhudoo be Annabi Nuhu zuɣu binnamda puuni."
  "37:80": "Achiika! Lala ka Ti (Tinim’ Naawuni) yɔri ninvuɣu suma samli."
  "37:81": "Achiika! O be Ti (Tinim’ Naawuni) dab’ shɛba ban ti Ti yɛlimaŋli puuni."
