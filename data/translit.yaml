  ma-asbaha-bi:
    - "Allāhumma mā "
    - {morning: "aṣbaḥa", evening: "amsā"}
    - " bī min niʿmatin aw bi-aḥadin min khalqik, fa-minka waḥdaka lā sharīka lak, fa-laka al-ḥamdu wa laka al-shukru ʿalā dhālik."
  subhan-allah-wa-bihamdih: "Subḥān Allāhi wa bi-ḥamdihi ʿadada khalqihi wa riḍāʾ nafsihi wa zinata ʿarshihi wa midāda kalimātih."
  subhan-allah-al-azim: "Subḥān Allāhi al-ʿAẓīmi wa bi-ḥamdihi ʿadada khalqihi wa riḍāʾ nafsihi wa zinata ʿarshihi wa midāda kalimātih."
  adad-tasbih: "Subḥān Allāhi ʿadada mā khalaqa fī al-samāʾ, subḥān Allāhi ʿadada mā khalaqa fī al-arḍ, subḥān Allāhi ʿadada mā bayna dhālik, subḥān Allāhi ʿadada mā Huwa khāliq."
  adad-tahmid: "Al-ḥamdu lillāhi ʿadada mā khalaqa fī al-samāʾ, al-ḥamdu lillāhi ʿadada mā khalaqa fī al-arḍ, al-ḥamdu lillāhi ʿadada mā bayna dhālik, al-ḥamdu lillāhi ʿadada mā Huwa khāliq."
  adad-tahlil: "Lā ilāha illā Allāh ʿadada mā khalaqa fī al-samāʾ, lā ilāha illā Allāh ʿadada mā khalaqa fī al-arḍ, lā ilāha illā Allāh ʿadada mā bayna dhālik, lā ilāha illā Allāh ʿadada mā Huwa khāliq."
  adad-takbir: "Allāhu akbar ʿadada mā khalaqa fī al-samāʾ, Allāhu akbar ʿadada mā khalaqa fī al-arḍ, Allāhu akbar ʿadada mā bayna dhālik, Allāhu akbar ʿadada mā Huwa khāliq."
  adad-hawqala: "Lā ḥawla wa lā quwwata illā billāh il-ʿAliyy il-ʿAẓīm ʿadada mā khalaqa fī al-samāʾ, lā ḥawla wa lā quwwata illā billāh il-ʿAliyy il-ʿAẓīm ʿadada mā khalaqa fī al-arḍ, lā ḥawla wa lā quwwata illā billāh il-ʿAliyy il-ʿAẓīm ʿadada mā bayna dhālik, lā ḥawla wa lā quwwata illā billāh il-ʿAliyy il-ʿAẓīm ʿadada mā Huwa khāliq."
  tahlil-dharrah: "Lā ilāha illā Allāhu waḥdahu lā sharīka lah, lahu ul-mulku wa lahu ul-ḥamdu, yuḥyī wa yumīt wa Huwa ʿalā kulli shayʾin qadīr, ʿadada kulli dharratin alfa marrah."
  salat-miftah: "Allāhumma ṣalli wa sallim ʿalā Sayyidinā Muḥammadin miftāḥi bāb raḥmat Illāh, ʿadada mā fī ʿilm Illāh, ṣalātan wa salāman dāʾimayni bi-dawāmi mulk Illāh, wa ʿalā ālihi wa ṣaḥbihi ʿadada kulli dharratin alfa marrah."
