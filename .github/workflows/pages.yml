name: Test, build and deploy

# Every push to main: run all tests, build the PDF and the static site, and
# publish both to GitHub Pages. Pull requests run the same tests and builds
# without deploying.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Same Ubuntu as the environment the PDF baseline was checked on: the
    # glyph-level PDF test depends on the system's Pango, HarfBuzz and Inter.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System fonts and libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-inter libpango-1.0-0 libpangoft2-1.0-0
          fc-list :family=Inter | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python dependencies
        run: pip install -r requirements.txt

      - name: Python tests (data, third-party checksums, PDF vs edition 1.0)
        run: python -m pytest -q

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Website dependencies
        run: bun install --frozen-lockfile

      - name: Website tests and type check
        run: |
          bunx vitest run
          bunx tsc --noEmit

      - name: Build the PDF
        run: python pdf/build.py

      - name: Add the PDF to the site
        # Into public/, before the build: the home page links it directly, and the
        # prerender crawler (STATIC_SITE below) follows that link and needs the file
        # to already exist on disk, not just copied in afterwards.
        run: cp build/al-Wird-al-Latif.pdf public/al-Wird-al-Latif.pdf

      - name: Pages settings
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build the static site
        env:
          STATIC_SITE: "1"
          # "/wird-al-latif" on github.io, "" with a custom domain.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: bunx vite build

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist/client

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
